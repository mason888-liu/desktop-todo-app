    batch_assign_factory: "批量指定厂家"          # class="ManualCheck WxVideo_Supplier_hide"
    batch_seller_note: "批量卖家备注"             # class="UpdateOrderSellerRemark WxVideo_Supplier_hide"

    # -- 分配厂家弹窗（layui 弹层，非 Ant Modal）--
